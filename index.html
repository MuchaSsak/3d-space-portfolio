<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Mateusz Muszarski, full-stack developer (TypeScript, React, three.js). A fully immersive 3D portfolio: fly from Earth to Neptune through my experience, projects and contact."
    />
    <meta name="author" content="Mateusz Muszarski" />
    <meta name="creator" content="Mateusz Muszarski" />
    <meta
      name="application-name"
      content="Mateusz Muszarski | 3D Space Portfolio"
    />
    <!-- The main portfolio lives on matmuszarski.space, this experience isn't meant to compete with it in search results -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://3d-space-folio.vercel.app/" />
    <meta
      property="og:title"
      content="Mateusz Muszarski | 3D Space Portfolio"
    />
    <meta
      property="og:description"
      content="Mateusz Muszarski, full-stack developer (TypeScript, React, three.js). A fully immersive 3D portfolio: fly from Earth to Neptune through my experience, projects and contact."
    />
    <meta property="og:url" content="https://3d-space-folio.vercel.app/" />
    <meta
      property="og:site_name"
      content="Mateusz Muszarski | 3D Space Portfolio"
    />
    <meta
      property="og:image"
      content="https://3d-space-folio.vercel.app/assets/pictures/3d_space_folio_thumbnail.jpg"
    />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta
      property="og:image:alt"
      content="Mateusz Muszarski | 3D Space Portfolio"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pl_PL" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="author" href="https://www.matmuszarski.space" />

    <!-- Critical assets of the startup screen -->
    <link
      rel="preload"
      href="/assets/pictures/startup_screen_background.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/assets/fonts/Space_Grotesk.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://avatars.githubusercontent.com" />

    <title>Mateusz Muszarski | 3D Space Portfolio</title>
    <style>
      /* Shown before the app (and its CSS) loads */
      html,
      body {
        margin: 0;
        background: #09090b;
        color: #fafafa;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          font-family: system-ui, sans-serif;
          text-align: center;
          padding: 1rem;
        "
      >
        <p>
          This 3D portfolio needs JavaScript. Visit
          <a href="https://www.matmuszarski.space" style="color: #a78bfa"
            >matmuszarski.space</a
          >
          for the regular version.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
